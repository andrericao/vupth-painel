<!DOCTYPE html>
<!--
  Modelo do index.html da web (pagina unica). O Expo le ESTE arquivo no lugar do dele e preenche
  o idioma e o titulo. Existe para levar o favicon do V (v-estilizado-pelo-front, Andre, 18/10;
  arquivos copiados de vupth-partner/assets/marca/). O reset de estilo e o recomendado do react-native-web.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      // Tema escolhido (claro, escuro ou sistema): aplicado antes de pintar, sem piscar. Ver src/escolhaDeTema.ts.
      try {
        var t = localStorage.getItem("vupth-painel:tema");
        if (t === "claro" || t === "escuro") document.documentElement.setAttribute("data-tema", t);
      } catch (e) {}
    </script>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Ative o JavaScript para usar o painel.
    </noscript>
    <div id="root"></div>
  </body>
</html>
