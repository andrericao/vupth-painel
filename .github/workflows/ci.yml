name: CI

on:
  push:
    branches: [dev, main]
    # Economia de minutos: doc nao mexe no app.
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [dev, main]

# Pushes em sequencia cancelam os runs anteriores da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# O deploy do site (Cloudflare Pages: dev na previa, main em producao) e' feito pela integracao
# Git do proprio Pages, que so publica depois deste CI verde se a branch estiver protegida por ele.
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (eslint --max-warnings 0)
        run: npx eslint . --max-warnings 0

      - run: npx tsc --noEmit

      - run: npm test -- --ci --coverage --bail --passWithNoTests

      - name: Config (expo-doctor)
        run: npx expo-doctor

      # O build que o Pages faz: se o export quebrar, quebra aqui antes do deploy.
      - name: Build web (expo export)
        run: npm run build:web
